name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test e build dell'APK
        run: ./gradlew :signal-model:test assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: greenwave-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Su main l'APK viene pubblicato anche nella release "latest",
      # così si scarica direttamente dal browser del telefono.
      - name: Pubblica la release "latest"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk greenwave.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest greenwave.apk \
            --prerelease \
            --title "Ultima build di main" \
            --notes "Build automatica del commit ${GITHUB_SHA::7}."
